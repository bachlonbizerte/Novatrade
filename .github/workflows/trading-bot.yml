name: Trading Bot

on:
  schedule:
    # Chaque minute, en théorie. ⚠️ GitHub Actions ne garantit PAS cette
    # précision : en cas de forte charge sur leurs serveurs, l'exécution
    # peut être retardée de plusieurs minutes. C'est documenté par GitHub
    # lui-même. Le vrai espacement des notifications est de toute façon
    # imposé côté code (min_minutes_between_notifications dans la config),
    # donc ce n'est pas un problème pour le résultat final.
    - cron: "* * * * *"
  workflow_dispatch:          # permet aussi de le lancer manuellement depuis GitHub

permissions:
  contents: write   # nécessaire pour que le job puisse commit les résultats du scan

concurrency:
  group: nova-scanner
  cancel-in-progress: true   # un nouveau run annule le précédent s'il est encore en cours (évite un blocage permanent)

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5   # filet de sécurité: tue le job s'il dépasse 5 min (un scan normal prend quelques secondes)
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Copier la config
        run: cp config/config.example.yaml config/config.yaml

      - name: Lancer le scanner multi-crypto
        env:
          EXCHANGE_API_KEY: ${{ secrets.EXCHANGE_API_KEY }}
          EXCHANGE_API_SECRET: ${{ secrets.EXCHANGE_API_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DRY_RUN: "true"   # passe à "false" seulement quand tu es prêt pour le réel
        run: python -m src.scanner

      - name: Publier les résultats pour le dashboard
        run: |
          git config user.name "nova-bot"
          git config user.email "nova-bot@users.noreply.github.com"
          git add docs/data/latest_scan.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: mise à jour du scan [skip ci]"
            git pull --no-rebase -X ours origin main --no-edit
            git push
          else
            echo "Rien à publier ce coup-ci."
          fi
