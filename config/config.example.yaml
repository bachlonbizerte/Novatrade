exchange:
  name: binance
  fallback: ["bybit", "kraken"]
  symbol: "BTC/USDT"
  timeframe: "15m"

strategy:
  name: "sma_crossover"
  fast_period: 9
  slow_period: 21

# Utilisé par scanner.py (analyse multi-crypto + multi-timeframe avec IA de décision)
watchlist:
  timeframes: ["15m", "1h", "4h"]
  timeframe_weights:
    "15m": 0.2
    "1h": 0.3
    "4h": 0.5
  notify_score_threshold: 80     # score final mini STRICT (sur 100) — sinon rien n'est envoyé
  max_notifications_per_day: 9999  # plafond quotidien, remis à zéro chaque jour (UTC)
  min_minutes_between_notifications: 5   # espacement minimum, même si le scanner tourne chaque minute
  send_daily_summary: true      # true si tu veux aussi un résumé de tous les scores à chaque run
  auto_trade: true                # ouvre automatiquement les positions ACHETER, SANS confirmation manuelle.
                                   # ⚠️ Ne fonctionne QUE si DRY_RUN=true (garde-fou codé en dur, pas juste
                                   # une histoire de config) — impossible d'auto-trader en argent réel.
  symbols:
    - "BTC/USDT"
    - "ETH/USDT"
    - "SOL/USDT"
    - "BNB/USDT"
    - "XRP/USDT"
    - "ADA/USDT"
    - "DOGE/USDT"
    - "AVAX/USDT"
    - "LINK/USDT"
    - "SUI/USDT"
    - "POL/USDT"
    - "DOT/USDT"
    - "TRX/USDT"
    - "LTC/USDT"
    - "BCH/USDT"
    - "ATOM/USDT"
    - "NEAR/USDT"
    - "APT/USDT"
    - "ARB/USDT"
    - "OP/USDT"
    - "UNI/USDT"
    - "AAVE/USDT"
    - "ICP/USDT"
    - "FIL/USDT"
    - "ETC/USDT"
    - "XLM/USDT"
    - "HBAR/USDT"
    - "ALGO/USDT"
    - "INJ/USDT"
    - "TON/USDT"

risk:
  capital_usd: 100                    # capital de référence de départ (évolue avec les gains/pertes simulés)
  capital_allocation_pct: 80          # % du capital courant utilisable pour trader — le reste (20%) reste en sécurité
  max_concurrent_positions: 2         # jusqu'à 4 positions ouvertes en même temps, budget partagé intelligemment entre elles
  max_position_duration_minutes: 60   # clôture automatique si ni le stop ni l'objectif ne sont touchés après ce délai
  stop_loss_pct: 1.0            # SL fixe: 1% sous le prix d'entrée
  take_profit_min_pct: 2.0      # TP dynamique: jamais moins de 2%
  take_profit_max_pct: 5.0      # TP dynamique: jamais plus de 5% (calé sur la volatilité ATR du moment)
  min_profit_to_close_pct: 0.5   # gain minimum exigé pour clôturer à l'échéance (sinon, prolongation auto)

backtest:
  start_date: "2024-01-01"
  end_date: "2024-12-31"
  initial_balance: 1000
  # Instruments non-crypto via Capital.com (métaux, indices...). Utilise leur
# compte Demo intégré. Nécessite CAPITAL_API_KEY, CAPITAL_IDENTIFIER,
# CAPITAL_API_PASSWORD dans le .env.
capital:
  enabled: true
  max_concurrent_positions: 2   # séparé des cryptos — 4 positions max ici, indépendamment des cryptos
  notify_score_threshold: 60
  auto_trade: true               # ouvre automatiquement sur le compte Demo, sans confirmation manuelle.
                                  # ⚠️ Ne fonctionne QUE si le client Capital.com est en mode Demo
                                  # (garde-fou codé en dur) — jamais d'auto-trade en mode reel
  symbols:
    - "GOLD"
    - "SILVER"
    - "OIL_CRUDE"
    - "NATURALGAS"
    - "COPPER"
    - "US500"
    - "US100"
