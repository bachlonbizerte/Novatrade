<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA Scanner — Tableau de bord</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0b0e12;
    --panel: #12161c;
    --border: #1f2530;
    --text: #d8dee6;
    --text-dim: #6b7684;
    --mono: 'IBM Plex Mono', 'Courier New', monospace;
    --sans: 'Inter', -apple-system, sans-serif;
    --buy: #35d68a;
    --wait: #e0b84a;
    --pass: #e0526a;
    --accent: #4fb8e8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    padding: 32px 20px 60px;
  }
  .wrap { max-width: 980px; margin: 0 auto; }
  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 1px solid var(--border);
    padding-bottom: 18px;
    margin-bottom: 28px;
    flex-wrap: wrap;
    gap: 10px;
  }
  h1 {
    font-family: var(--mono);
    font-size: 20px;
    letter-spacing: 0.5px;
    margin: 0;
    font-weight: 600;
  }
  h1 span { color: var(--accent); }
  #updated { font-family: var(--mono); font-size: 12px; color: var(--text-dim); }

  .grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 14px;
    margin-bottom: 32px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 16px 18px;
    display: grid;
    grid-template-columns: 90px 1fr 70px 130px;
    align-items: center;
    gap: 14px;
  }
  .card .symbol { font-family: var(--mono); font-weight: 600; font-size: 15px; }
  .card .bar-track {
    height: 6px;
    background: #1a2029;
    border-radius: 3px;
    overflow: hidden;
  }
  .card .bar-fill { height: 100%; border-radius: 3px; }
  .card .score { font-family: var(--mono); text-align: right; font-size: 14px; color: var(--text-dim); }
  .badge {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.5px;
    padding: 4px 10px;
    border-radius: 3px;
    text-align: center;
    font-weight: 600;
  }
  .badge.ACHETER { background: rgba(53,214,138,0.12); color: var(--buy); border: 1px solid rgba(53,214,138,0.3); }
  .badge.ATTENDRE { background: rgba(224,184,74,0.12); color: var(--wait); border: 1px solid rgba(224,184,74,0.3); }
  .badge.PASSER, .badge.ERREUR { background: rgba(224,82,106,0.12); color: var(--pass); border: 1px solid rgba(224,82,106,0.3); }

  .reasoning {
    grid-column: 1 / -1;
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--text-dim);
    margin-top: 6px;
    padding-top: 10px;
    border-top: 1px dashed var(--border);
    display: none;
  }
  .card.open .reasoning { display: block; }
  .card { cursor: pointer; }
  .reasoning div { margin-bottom: 3px; }

  #stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }
  .stat {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 14px 16px;
  }
  .stat .label { font-family: var(--mono); font-size: 10.5px; color: var(--text-dim); letter-spacing: 0.5px; }
  .stat .value { font-family: var(--mono); font-size: 22px; font-weight: 600; margin-top: 4px; }
  .stat .value.pos { color: var(--buy); }
  .stat .value.neg { color: var(--pass); }

  #empty { font-family: var(--mono); color: var(--text-dim); font-size: 13px; padding: 40px 0; text-align: center; }
  #chart-wrap { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 18px; margin-bottom: 28px; }
  footer { font-family: var(--mono); font-size: 11px; color: var(--text-dim); text-align: center; margin-top: 20px; }

  #positions-section { margin-bottom: 32px; }
  #positions-section h2 {
    font-family: var(--mono); font-size: 13px; letter-spacing: 0.5px;
    color: var(--text-dim); font-weight: 600; margin: 0 0 12px;
  }
  .position-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
    padding: 16px 18px; margin-bottom: 12px;
  }
  .position-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; flex-wrap: wrap; gap: 6px; }
  .position-symbol { font-family: var(--mono); font-weight: 600; font-size: 15px; }
  .position-pnl { font-family: var(--mono); font-size: 14px; font-weight: 600; }
  .position-pnl.pos { color: var(--buy); }
  .position-pnl.neg { color: var(--pass); }
  .position-range-track {
    position: relative; height: 8px; background: #1a2029; border-radius: 4px; margin: 18px 0 6px;
  }
  .position-range-fill { position: absolute; top: 0; bottom: 0; border-radius: 4px; background: var(--accent); }
  .position-marker {
    position: absolute; top: -18px; transform: translateX(-50%);
    font-family: var(--mono); font-size: 9.5px; color: var(--text-dim); white-space: nowrap;
  }
  .position-dot {
    position: absolute; top: 50%; width: 10px; height: 10px; border-radius: 50%;
    background: var(--text); transform: translate(-50%, -50%); border: 2px solid var(--bg);
  }
  .position-labels { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 10px; color: var(--text-dim); margin-top: 14px; }
  .position-meta { font-family: var(--mono); font-size: 11px; color: var(--text-dim); margin-top: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>NOVA <span>SCANNER</span></h1>
    <div id="updated">chargement…</div>
  </header>

  <div id="stats"></div>

  <div id="positions-section" style="display:none;">
    <h2>POSITIONS OUVERTES — PROGRESSION EN TEMPS RÉEL</h2>
    <div id="positions-list"></div>
  </div>

  <div id="chart-wrap"><canvas id="scoreChart" height="90"></canvas></div>

  <div id="empty" style="display:none;">Aucune donnée pour l'instant — attends le prochain run du scanner (cron GitHub Actions).</div>
  <div class="grid" id="cards"></div>

  <footer>Données générées automatiquement par le scanner · usage éducatif, ne constitue pas un conseil financier</footer>
</div>

<script>
// Chemin relatif car data/ est servi depuis le même dossier docs/ par GitHub Pages
const DATA_URL = "./data/latest_scan.json";
const TRADES_URL = "./data/trades.json";

const colorFor = (reco) => reco === "ACHETER" ? "var(--buy)" : reco === "ATTENDRE" ? "var(--wait)" : "var(--pass)";

async function fetchLivePrice(symbol) {
  // Appel public direct à Binance (pas besoin de clé) pour le prix courant.
  // Si bloqué/indisponible depuis le navigateur, on se contente d'afficher
  // entrée/stop/objectif sans le point de progression en temps réel.
  const ticker = symbol.replace("/", "");
  const res = await fetch(`https://api.binance.com/api/v3/ticker/price?symbol=${ticker}`);
  const data = await res.json();
  return parseFloat(data.price);
}

function timeElapsed(openedAt) {
  const mins = Math.floor((Date.now() - new Date(openedAt).getTime()) / 60000);
  if (mins < 60) return `${mins} min`;
  return `${Math.floor(mins / 60)}h ${mins % 60}min`;
}

async function loadPositions() {
  let trades;
  try {
    const res = await fetch(TRADES_URL + "?t=" + Date.now());
    trades = await res.json();
  } catch (e) {
    return; // pas de trades.json encore généré, rien à afficher
  }

  const open = (trades || []).filter(t => t.status === "open");
  const section = document.getElementById("positions-section");
  const listEl = document.getElementById("positions-list");

  if (!open.length) {
    section.style.display = "none";
    return;
  }
  section.style.display = "block";
  listEl.innerHTML = "";

  for (const t of open) {
    const card = document.createElement("div");
    card.className = "position-card";
    listEl.appendChild(card);

    let livePrice = null;
    try { livePrice = await fetchLivePrice(t.symbol); } catch (e) { /* pas grave, on affiche sans le point live */ }

    const low = t.stop_loss_price, high = t.take_profit_price;
    const range = high - low;
    const clampPct = (p) => Math.max(0, Math.min(100, p));
    const entryPct = clampPct(((t.entry_price - low) / range) * 100);
    const nowPct = livePrice !== null ? clampPct(((livePrice - low) / range) * 100) : null;

    const pnlPct = livePrice !== null ? ((livePrice - t.entry_price) / t.entry_price * 100) : null;
    const pnlUsd = pnlPct !== null ? (t.position_size_usdt * pnlPct / 100) : null;
    const pnlClass = pnlPct === null ? "" : pnlPct >= 0 ? "pos" : "neg";
    const pnlText = pnlPct === null
      ? "prix en direct indisponible"
      : `${pnlPct >= 0 ? "+" : ""}${pnlPct.toFixed(2)}% (${pnlUsd >= 0 ? "+" : ""}${pnlUsd.toFixed(2)} USDT)`;

    card.innerHTML = `
      <div class="position-top">
        <div class="position-symbol">${t.symbol}</div>
        <div class="position-pnl ${pnlClass}">${pnlText}</div>
      </div>
      <div class="position-range-track">
        <div class="position-range-fill" style="left:0; width:${entryPct}%; opacity:0.15;"></div>
        <div class="position-marker" style="left:0;">STOP</div>
        <div class="position-marker" style="left:100%; transform:translateX(-100%);">OBJECTIF</div>
        <div class="position-dot" style="left:${entryPct}%; background:var(--text-dim);" title="Entrée"></div>
        ${nowPct !== null ? `<div class="position-dot" style="left:${nowPct}%; background:var(--accent);" title="Prix actuel"></div>` : ""}
      </div>
      <div class="position-labels">
        <span>${low}</span>
        <span>${high}</span>
      </div>
      <div class="position-meta">
        Entrée: ${t.entry_price} · Montant: ${t.position_size_usdt} USDT · Ouverte depuis ${timeElapsed(t.opened_at)}
        ${livePrice !== null ? ` · Prix actuel: ${livePrice}` : ""}
      </div>
    `;
  }
}

async function load() {
  try {
    const res = await fetch(DATA_URL + "?t=" + Date.now());
    const data = await res.json();
    render(data);
  } catch (e) {
    document.getElementById("empty").style.display = "block";
    document.getElementById("updated").textContent = "pas de données disponibles";
  }
  loadPositions();
}

function renderStats(perf) {
  if (!perf) return;
  const pnlClass = perf.cumulative_pnl_pct > 0 ? "pos" : perf.cumulative_pnl_pct < 0 ? "neg" : "";
  const items = [
    ["TRADES CLÔTURÉS", perf.total_trades, ""],
    ["POSITIONS OUVERTES", perf.open_positions, ""],
    ["TAUX DE RÉUSSITE", perf.win_rate_pct + "%", ""],
    ["PNL CUMULÉ", (perf.cumulative_pnl_pct > 0 ? "+" : "") + perf.cumulative_pnl_pct + "% (" +
      (perf.cumulative_pnl_usd > 0 ? "+" : "") + perf.cumulative_pnl_usd + " USD)", pnlClass],
  ];
  document.getElementById("stats").innerHTML = items.map(([label, value, cls]) => `
    <div class="stat">
      <div class="label">${label}</div>
      <div class="value ${cls}">${value}</div>
    </div>
  `).join("");
}

function render(data) {
  const results = (data.results || []).slice().sort((a, b) => b.final_score - a.final_score);
  document.getElementById("updated").textContent = "Dernier scan : " + new Date(data.generated_at).toLocaleString("fr-FR");
  renderStats(data.performance);

  if (!results.length) {
    document.getElementById("empty").style.display = "block";
    return;
  }

  const cardsEl = document.getElementById("cards");
  cardsEl.innerHTML = "";
  results.forEach(r => {
    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `
      <div class="symbol">${r.symbol}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${r.final_score}%; background:${colorFor(r.recommendation)}"></div></div>
      <div class="score">${r.final_score}/100</div>
      <div class="badge ${r.recommendation}">${r.recommendation}</div>
      <div class="reasoning">${(r.reasoning || []).map(x => `<div>› ${x}</div>`).join("")}</div>
    `;
    div.addEventListener("click", () => div.classList.toggle("open"));
    cardsEl.appendChild(div);
  });

  new Chart(document.getElementById("scoreChart"), {
    type: "bar",
    data: {
      labels: results.map(r => r.symbol.replace("/USDT", "")),
      datasets: [{
        data: results.map(r => r.final_score),
        backgroundColor: results.map(r => colorFor(r.recommendation)),
        borderRadius: 3,
      }]
    },
    options: {
      plugins: { legend: { display: false } },
      scales: {
        y: { min: 0, max: 100, grid: { color: "#1a2029" }, ticks: { color: "#6b7684", font: { family: "monospace" } } },
        x: { grid: { display: false }, ticks: { color: "#6b7684", font: { family: "monospace" } } }
      }
    }
  });
}

load();
setInterval(loadPositions, 30000);  // rafraîchit le prix des positions ouvertes toutes les 30s
</script>
</body>
</html>
